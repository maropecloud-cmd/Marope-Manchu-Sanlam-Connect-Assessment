name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore IHub.slnx

      - name: Build (warnings as errors, vulnerable packages fail the build)
        run: dotnet build IHub.slnx -c Release --no-restore

      - name: Test (integration tests start SQL Server via Testcontainers)
        run: dotnet test IHub.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Migrations are in sync with the model
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations has-pending-model-changes --project src/IHub.Api --no-build --configuration Release

  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Start the stack (docker compose up --build)
        run: |
          docker compose up --build -d
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health/ready && exit 0
            sleep 5
          done
          docker compose logs api
          exit 1

      - name: Load and failure simulation (database restarted mid-load)
        run: >
          dotnet run --project tools/IHub.Simulator -c Release --
          --activities 3000 --rate 300 --restart-db-after 10 --report simulation.md

      - name: Publish report
        if: always()
        run: test -f simulation.md && cat simulation.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: API logs on failure
        if: failure()
        run: docker compose logs api --tail 200
