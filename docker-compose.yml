# Local use only. Overrides: see .env.example.

name: ihub

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-IHub_Local_Dev_2026!}
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__IHub: "Server=sqlserver,1433;Database=IHub;User Id=sa;Password=${MSSQL_SA_PASSWORD:-IHub_Local_Dev_2026!};Encrypt=True;TrustServerCertificate=True;Connect Timeout=5"
      Database__ApplyMigrationsOnStartup: "true"
      Api__EnableApiReference: "true"
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  sqldata:
